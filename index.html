<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IIST AR - Clean Logic Panel</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        #ui { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; text-align: center; font-family: sans-serif; 
            background: rgba(15, 15, 15, 0.9); padding: 20px; 
            border-radius: 20px; color: white; display: none; 
            border: 2px solid #00d2ff; width: 85%; max-width: 350px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }
        .btn-container { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
        .btn { 
            flex: 1; padding: 18px 10px; cursor: pointer; border: none; 
            border-radius: 12px; font-weight: bold; font-size: 16px; 
            transition: 0.3s; text-transform: uppercase;
        }
        .off { background: #333; color: #888; border-bottom: 4px solid #111; }
        .on { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; border-bottom: 4px solid #008800; }
        #status-label { font-size: 14px; color: #00d2ff; letter-spacing: 2px; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="status-label">IIST LOGIC INPUTS</div>
        <div class="btn-container">
            <button id="btnA" class="btn off">A: 0</button>
            <button id="btnB" class="btn off">B: 0</button>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="andTarget">
            
            <!-- Main Lab Board -->
            <a-plane position="0 0 0" width="1.3" height="1.5" color="#111" opacity="0.95" side="double" material="metalness: 0.5; roughness: 0.2">
                
                <!-- Board Title -->
                <a-text value="AND GATE - TRUTH TABLE" position="0 0.65 0.01" align="center" width="2.2" color="#00d2ff" font="exo2bold"></a-text>
                
                <!-- Table Header Background -->
                <a-plane position="0 0.45 0.01" width="1.1" height="0.15" color="#222"></a-plane>
                
                <!-- Table Layout -->
                <a-text value="INPUT A    INPUT B    OUTPUT" position="0 0.45 0.02" align="center" width="1.8" color="#aaa"></a-text>

                <!-- Data Rows -->
                <a-text value="0          0          0" position="0 0.3 0.02" align="center" width="2" color="white"></a-text>
                <a-text value="0          1          0" position="0 0.15 0.02" align="center" width="2" color="white"></a-text>
                <a-text value="1          0          0" position="0 0.0 0.02" align="center" width="2" color="white"></a-text>
                
                <!-- Separator Line -->
                <a-plane position="0 -0.1 0.01" width="1.1" height="0.005" color="#444"></a-plane>

                <!-- Dynamic Status Row -->
                <a-plane id="highlight" position="0 -0.25 0.01" width="1.1" height="0.18" color="#333" opacity="0.5">
                    <a-text id="currentStatus" value="1          1          0" position="0 0 0.01" align="center" width="2.2" font="exo2bold" color="#ff4444"></a-text>
                </a-plane>

                <!-- Branding -->
                <a-text value="IIST AR LAB SYSTEM" position="0 -0.6 0.01" align="center" width="1.5" color="#00d2ff" opacity="0.7"></a-text>
                
            </a-plane>

        </a-entity>
    </a-scene>

    <script>
        let inA = 0, inB = 0;
        const ui = document.querySelector('#ui'), andTarget = document.querySelector('#andTarget');
        const btnA = document.getElementById('btnA'), btnB = document.getElementById('btnB');
        const currentStatus = document.getElementById('currentStatus');
        const highlight = document.getElementById('highlight');

        andTarget.addEventListener("targetFound", () => { ui.style.display = "block"; });
        andTarget.addEventListener("targetLost", () => { ui.style.display = "none"; });

        function updateLogic() {
            let out = (inA === 1 && inB === 1) ? 1 : 0;
            
            if (out === 1) {
                currentStatus.setAttribute('value', '1          1          1');
                currentStatus.setAttribute('color', '#00ff00');
                highlight.setAttribute('color', '#004400');
            } else {
                currentStatus.setAttribute('value', '1          1          0');
                currentStatus.setAttribute('color', '#ff4444');
                highlight.setAttribute('color', '#440000');
            }
        }

        btnA.onclick = () => {
            inA = inA === 0 ? 1 : 0;
            btnA.innerText = `A: ${inA}`;
            btnA.className = inA ? 'btn on' : 'btn off';
            updateLogic();
        };

        btnB.onclick = () => {
            inB = inB === 0 ? 1 : 0;
            btnB.innerText = `B: ${inB}`;
            btnB.className = inB ? 'btn on' : 'btn off';
            updateLogic();
        };
    </script>
</body>
</html>
