<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IIST AR - Clean Logic Lab</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        
        #ui { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: rgba(15, 15, 15, 0.95); padding: 20px; 
            border-radius: 25px; color: white; display: none; 
            border: 2px solid #00d2ff; width: 85%; max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Truth Table Style inside UI */
        .table-container {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 20px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { color: #00d2ff; padding-bottom: 8px; border-bottom: 1px solid #333; letter-spacing: 1px; }
        td { padding: 8px; color: #ccc; }
        
        /* Highlight row based on logic */
        .active-row { color: #00ff00 !important; font-weight: bold; background: rgba(0, 255, 0, 0.1); }
        .inactive-row { color: #ff4444 !important; font-weight: bold; background: rgba(255, 68, 68, 0.1); }

        .btn-container { display: flex; justify-content: center; gap: 15px; }

        .btn { 
            flex: 1; padding: 15px 10px; cursor: pointer; border: none; 
            border-radius: 12px; font-weight: bold; font-size: 16px; 
            transition: 0.3s; text-transform: uppercase;
        }

        .off { background: #333; color: #888; border-bottom: 4px solid #111; }
        .on { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; border-bottom: 4px solid #008800; }
        
        .label { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="label">AND Gate Truth Table</div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>A</th><th>B</th><th>OUT</th></tr>
                </thead>
                <tbody>
                    <tr id="row00"><td>0</td><td>0</td><td>0</td></tr>
                    <tr id="row01"><td>0</td><td>1</td><td>0</td></tr>
                    <tr id="row10"><td>1</td><td>0</td><td>0</td></tr>
                    <tr id="row11"><td>1</td><td>1</td><td>1</td></tr>
                </tbody>
            </table>
        </div>

        <div class="label">Switch Inputs</div>
        <div class="btn-container">
            <button id="btnA" class="btn off">A: 0</button>
            <button id="btnB" class="btn off">B: 0</button>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="andTarget">
            <!-- மேலே இருந்த Truth Table Plane நீக்கப்பட்டுவிட்டது. 
                 இங்கு நீங்கள் விரும்பும் 3D மாடல்களை மட்டும் சேர்த்துக்கொள்ளலாம் -->
        </a-entity>
    </a-scene>

    <script>
        let inA = 0, inB = 0;
        const ui = document.querySelector('#ui'), andTarget = document.querySelector('#andTarget');
        const btnA = document.getElementById('btnA'), btnB = document.getElementById('btnB');

        // படம் கண்டறியப்பட்டால் UI தோன்றும்
        andTarget.addEventListener("targetFound", () => { ui.style.display = "block"; updateLogic(); });
        andTarget.addEventListener("targetLost", () => { ui.style.display = "none"; });

        function updateLogic() {
            // பழைய ஹைலைட்களை நீக்குதல்
            document.querySelectorAll('tr').forEach(tr => tr.className = '');

            // தற்போதைய இன்புட்டிற்குரிய ரோவை ஹைலைட் செய்தல்
            let rowId = `row${inA}${inB}`;
            let activeRow = document.getElementById(rowId);
            
            // AND Logic முடிவு
            let out = (inA === 1 && inB === 1) ? 1 : 0;
            activeRow.className = (out === 1) ? 'active-row' : 'inactive-row';
        }

        btnA.onclick = () => {
            inA = inA === 0 ? 1 : 0;
            btnA.innerText = `A: ${inA}`;
            btnA.className = inA ? 'btn on' : 'btn off';
            updateLogic();
        };

        btnB.onclick = () => {
            inB = inB === 0 ? 1 : 0;
            btnB.innerText = `B: ${inB}`;
            btnB.className = inB ? 'btn on' : 'btn off';
            updateLogic();
        };
    </script>
</body>
</html>
