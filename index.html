<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IIST AR - 3D Multi Gate Table</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #ui { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; display: none; width: 80%; max-width: 300px;
        }
        .btn-container { display: flex; gap: 10px; }
        .btn { 
            flex: 1; padding: 15px; cursor: pointer; border: none; 
            border-radius: 12px; font-weight: bold; font-size: 16px; 
            transition: 0.3s; text-transform: uppercase;
        }
        .off { background: #333; color: #888; border-bottom: 4px solid #111; }
        .on { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; border-bottom: 4px solid #008800; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="btn-container">
            <button id="btnA" class="btn off">A: 0</button>
            <button id="btnB" class="btn off">B: 0</button>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- AND GATE (Target 0) -->
        <a-entity mindar-image-target="targetIndex: 0" id="andTarget" class="logic-gate" data-gate="AND">
            <a-box position="0 0 0" width="1.1" height="1.3" depth="0.02" color="#111" opacity="0.9">
                <a-text value="AND GATE TRUTH TABLE" position="0 0.5 0.02" align="center" width="2" color="#00d2ff"></a-text>
                <a-text value="A    B  |  OUT" position="0 0.3 0.02" align="center" width="2.5" color="#aaa"></a-text>
                <a-entity line="start: -0.4 0.22 0.02; end: 0.4 0.22 0.02; color: #444"></a-entity>
                <a-text value="0    0  |   0" position="0 0.1 0.02" align="center" width="2.5" color="white"></a-text>
                <a-text value="0    1  |   0" position="0 -0.05 0.02" align="center" width="2.5" color="white"></a-text>
                <a-text value="1    0  |   0" position="0 -0.2 0.02" align="center" width="2.5" color="white"></a-text>
                <a-plane id="highlightAND" position="0 -0.35 0.01" width="0.9" height="0.12" color="#222" opacity="0.8">
                    <a-text id="rowAND" value="1    1  |   0" position="0 0 0.01" align="center" width="2.5" color="#ff4444"></a-text>
                </a-plane>
                <a-text value="IIST AR LAB" position="0 -0.55 0.02" align="center" width="1.2" color="#555"></a-text>
            </a-box>
        </a-entity>

        <!-- OR GATE (Target 1) -->
        <a-entity mindar-image-target="targetIndex: 1" id="orTarget" class="logic-gate" data-gate="OR">
            <a-box position="0 0 0" width="1.1" height="1.3" depth="0.02" color="#111" opacity="0.9">
                <a-text value="OR GATE TRUTH TABLE" position="0 0.5 0.02" align="center" width="2" color="#00d2ff"></a-text>
                <a-text value="A    B  |  OUT" position="0 0.3 0.02" align="center" width="2.5" color="#aaa"></a-text>
                <a-entity line="start: -0.4 0.22 0.02; end: 0.4 0.22 0.02; color: #444"></a-entity>
                <a-text value="0    0  |   0" position="0 0.1 0.02" align="center" width="2.5" color="white"></a-text>
                <a-text value="0    1  |   1" position="0 -0.05 0.02" align="center" width="2.5" color="white"></a-text>
                <a-text value="1    0  |   1" position="0 -0.2 0.02" align="center" width="2.5" color="white"></a-text>
                <a-plane id="highlightOR" position="0 -0.35 0.01" width="0.9" height="0.12" color="#222" opacity="0.8">
                    <a-text id="rowOR" value="1    1  |   1" position="0 0 0.01" align="center" width="2.5" color="#00ff00"></a-text>
                </a-plane>
                <a-text value="IIST AR LAB" position="0 -0.55 0.02" align="center" width="1.2" color="#555"></a-text>
            </a-box>
        </a-entity>

        <!-- NOT GATE (Target 2) -->
        <a-entity mindar-image-target="targetIndex: 2" id="notTarget" class="logic-gate" data-gate="NOT">
            <a-box position="0 0 0" width="1.1" height="1.3" depth="0.02" color="#111" opacity="0.9">
                <a-text value="NOT GATE TRUTH TABLE" position="0 0.5 0.02" align="center" width="2" color="#00d2ff"></a-text>
                <a-text value="INPUT (A) |  OUT" position="0 0.3 0.02" align="center" width="2.5" color="#aaa"></a-text>
                <a-entity line="start: -0.4 0.22 0.02; end: 0.4 0.22 0.02; color: #444"></a-entity>
                <a-text id="notRow0" value="0        |   1" position="0 0.1 0.02" align="center" width="2.5" color="white"></a-text>
                <a-plane id="highlightNOT" position="0 -0.05 0.01" width="0.9" height="0.12" color="#222" opacity="0.8">
                    <a-text id="rowNOT" value="1        |   0" position="0 0 0.01" align="center" width="2.5" color="#ff4444"></a-text>
                </a-plane>
                <a-text value="IIST AR LAB" position="0 -0.55 0.02" align="center" width="1.2" color="#555"></a-text>
            </a-box>
        </a-entity>

    </a-scene>

    <script>
        let inA = 0, inB = 0, activeGate = "";
        const ui = document.querySelector('#ui');
        const btnA = document.getElementById('btnA'), btnB = document.getElementById('btnB');

        // Logic Targets
        const targets = document.querySelectorAll('.logic-gate');

        targets.forEach(target => {
            target.addEventListener("targetFound", () => {
                activeGate = target.getAttribute('data-gate');
                ui.style.display = "block";
                // NOT gate என்றால் B பட்டனை மறைத்துவிடு
                btnB.style.display = (activeGate === "NOT") ? "none" : "block";
                updateLogic();
            });
            target.addEventListener("targetLost", () => { ui.style.display = "none"; });
        });

        function updateLogic() {
            if (activeGate === "AND") {
                let out = (inA === 1 && inB === 1) ? 1 : 0;
                const row = document.getElementById('rowAND'), hl = document.getElementById('highlightAND');
                row.setAttribute('value', `1    1  |   ${out}`);
                row.setAttribute('color', out ? '#00ff00' : '#ff4444');
                hl.setAttribute('color', out ? '#004400' : '#440000');
            } 
            else if (activeGate === "OR") {
                let out = (inA === 1 || inB === 1) ? 1 : 0;
                const row = document.getElementById('rowOR'), hl = document.getElementById('highlightOR');
                row.setAttribute('value', `1    1  |   ${out}`);
                row.setAttribute('color', out ? '#00ff00' : '#ff4444');
                hl.setAttribute('color', out ? '#004400' : '#440000');
            }
            else if (activeGate === "NOT") {
                let out = (inA === 1) ? 0 : 1;
                const row = document.getElementById('rowNOT'), hl = document.getElementById('highlightNOT');
                row.setAttribute('value', `1        |   ${out}`);
                row.setAttribute('color', out ? '#00ff00' : '#ff4444');
                hl.setAttribute('color', out ? '#004400' : '#440000');
            }
        }

        btnA.onclick = () => {
            inA = inA === 0 ? 1 : 0;
            btnA.innerText = `A: ${inA}`;
            btnA.className = inA ? 'btn on' : 'btn off';
            updateLogic();
        };

        btnB.onclick = () => {
            inB = inB === 0 ? 1 : 0;
            btnB.innerText = `B: ${inB}`;
            btnB.className = inB ? 'btn on' : 'btn off';
            updateLogic();
        };
    </script>
</body>
</html>
