<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>IIST AR - AND Gate Table</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: none;
            width: 85%;
            max-width: 320px;
        }

        .btn-container {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .off {
            background: #222;
            color: #888;
            border-bottom: 5px solid #111;
        }

        .on {
            background: #00ff88;
            color: black;
            border-bottom: 5px solid #009944;
            box-shadow: 0 0 20px #00ff88;
        }

        #statusText {
            margin-top: 12px;
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px black;
        }
    </style>
</head>

<body>

    <!-- MOBILE UI -->
    <div id="ui">

        <div class="btn-container">
            <button id="btnA" class="btn off">A : 0</button>
            <button id="btnB" class="btn off">B : 0</button>
        </div>

        <div id="statusText">
            OUTPUT : 0
        </div>

    </div>

    <!-- AR SCENE -->
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- CAMERA -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- TARGET -->
        <a-entity mindar-image-target="targetIndex: 0" id="andTarget">

            <!-- MAIN BOARD -->
            <a-box
                position="0 0 0"
                width="1.2"
                height="1.4"
                depth="0.03"
                color="#111"
                opacity="0.92">

                <!-- TITLE -->
                <a-text
                    value="AND GATE TRUTH TABLE"
                    position="0 0.55 0.03"
                    align="center"
                    width="2.2"
                    color="#00d2ff">
                </a-text>

                <!-- HEADER -->
                <a-text
                    value="A     B   |   OUT"
                    position="0 0.35 0.03"
                    align="center"
                    width="2.4"
                    color="#aaaaaa">
                </a-text>

                <!-- LINE -->
                <a-entity
                    line="start: -0.45 0.25 0.03; end: 0.45 0.25 0.03; color: #555">
                </a-entity>

                <!-- HIGHLIGHT BACKGROUND -->
                <a-plane
                    id="highlightPlane"
                    position="0 0.1 0.02"
                    width="0.95"
                    height="0.12"
                    color="#004400"
                    opacity="0.7"
                    visible="true">
                </a-plane>

                <!-- ROWS -->
                <a-text
                    id="row00"
                    value="0     0   |    0"
                    position="0 0.1 0.03"
                    align="center"
                    width="2.4"
                    color="white">
                </a-text>

                <a-text
                    id="row01"
                    value="0     1   |    0"
                    position="0 -0.05 0.03"
                    align="center"
                    width="2.4"
                    color="white">
                </a-text>

                <a-text
                    id="row10"
                    value="1     0   |    0"
                    position="0 -0.2 0.03"
                    align="center"
                    width="2.4"
                    color="white">
                </a-text>

                <a-text
                    id="row11"
                    value="1     1   |    1"
                    position="0 -0.35 0.03"
                    align="center"
                    width="2.4"
                    color="white">
                </a-text>

                <!-- OUTPUT LIGHT -->
                <a-sphere
                    id="outputLight"
                    position="0 -0.58 0.04"
                    radius="0.06"
                    color="#550000"
                    emissive="#220000">
                </a-sphere>

                <!-- LABEL -->
                <a-text
                    id="outputLabel"
                    value="OUTPUT OFF"
                    position="0 -0.72 0.03"
                    align="center"
                    width="1.5"
                    color="#ff4444">
                </a-text>

            </a-box>

        </a-entity>

    </a-scene>

    <script>

        let inA = 0;
        let inB = 0;

        const ui = document.getElementById("ui");
        const andTarget = document.getElementById("andTarget");

        const btnA = document.getElementById("btnA");
        const btnB = document.getElementById("btnB");

        const row00 = document.getElementById("row00");
        const row01 = document.getElementById("row01");
        const row10 = document.getElementById("row10");
        const row11 = document.getElementById("row11");

        const highlightPlane = document.getElementById("highlightPlane");

        const outputLight = document.getElementById("outputLight");
        const outputLabel = document.getElementById("outputLabel");

        const statusText = document.getElementById("statusText");

        // TARGET EVENTS
        andTarget.addEventListener("targetFound", () => {
            ui.style.display = "block";
        });

        andTarget.addEventListener("targetLost", () => {
            ui.style.display = "none";
        });

        // RESET COLORS
        function resetRows() {

            row00.setAttribute("color", "white");
            row01.setAttribute("color", "white");
            row10.setAttribute("color", "white");
            row11.setAttribute("color", "white");

        }

        // UPDATE LOGIC
        function updateLogic() {

            resetRows();

            let out = (inA === 1 && inB === 1) ? 1 : 0;

            statusText.innerHTML = `OUTPUT : ${out}`;

            // OUTPUT LIGHT
            if (out === 1) {

                outputLight.setAttribute("color", "#00ff00");
                outputLight.setAttribute("emissive", "#00ff00");

                outputLabel.setAttribute("value", "OUTPUT ON");
                outputLabel.setAttribute("color", "#00ff00");

            } else {

                outputLight.setAttribute("color", "#550000");
                outputLight.setAttribute("emissive", "#220000");

                outputLabel.setAttribute("value", "OUTPUT OFF");
                outputLabel.setAttribute("color", "#ff4444");

            }

            // HIGHLIGHT CURRENT ROW

            if (inA === 0 && inB === 0) {

                row00.setAttribute("color", "#00ff00");

                highlightPlane.setAttribute(
                    "position",
                    "0 0.1 0.02"
                );

            }

            else if (inA === 0 && inB === 1) {

                row01.setAttribute("color", "#00ff00");

                highlightPlane.setAttribute(
                    "position",
                    "0 -0.05 0.02"
                );

            }

            else if (inA === 1 && inB === 0) {

                row10.setAttribute("color", "#00ff00");

                highlightPlane.setAttribute(
                    "position",
                    "0 -0.2 0.02"
                );

            }

            else if (inA === 1 && inB === 1) {

                row11.setAttribute("color", "#00ff00");

                highlightPlane.setAttribute(
                    "position",
                    "0 -0.35 0.02"
                );

            }

        }

        // BUTTON A
        btnA.onclick = () => {

            inA = inA === 0 ? 1 : 0;

            btnA.innerText = `A : ${inA}`;

            btnA.className = inA ? "btn on" : "btn off";

            updateLogic();

        };

        // BUTTON B
        btnB.onclick = () => {

            inB = inB === 0 ? 1 : 0;

            btnB.innerText = `B : ${inB}`;

            btnB.className = inB ? "btn on" : "btn off";

            updateLogic();

        };

        // START
        updateLogic();

    </script>

</body>
</html>
