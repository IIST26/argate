<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIST - HD Logic Lab</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* மெயின் கன்சோல் பாக்ஸ் */
        .lab-container {
            width: 90%;
            max-width: 400px;
            background: #111;
            border: 2px solid #00d2ff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
            text-align: center;
        }

        h2 {
            color: #00d2ff;
            font-size: 18px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Truth Table Style */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-family: monospace;
            font-size: 18px;
        }

        th {
            color: #ffff00;
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #222;
        }

        .row-off { color: #ff5555; }
        .row-on { color: #00ff00; font-weight: bold; }

        /* Status Display */
        #output-panel {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #333;
        }

        #statusText {
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .off {
            background: #333;
            color: #888;
            border-bottom: 4px solid #1a1a1a;
        }

        .on {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            border-bottom: 4px solid #008800;
        }
    </style>
</head>
<body>

    <div class="lab-container">
        <h2>IIST Virtual Logic Lab</h2>

        <!-- அவுட்புட் டிஸ்ப்ளே -->
        <div id="output-panel">
            <div id="statusText">OUTPUT: 0 (OFF)</div>
        </div>

        <!-- Truth Table -->
        <table>
            <thead>
                <tr>
                    <th>A</th>
                    <th>B</th>
                    <th>OUT</th>
                </tr>
            </thead>
            <tbody>
                <tr class="row-off"><td>0</td><td>0</td><td>0</td></tr>
                <tr class="row-off"><td>0</td><td>1</td><td>0</td></tr>
                <tr class="row-off"><td>1</td><td>0</td><td>0</td></tr>
                <tr class="row-on"><td>1</td><td>1</td><td>1</td></tr>
            </tbody>
        </table>

        <!-- கட்டுப்பாட்டு பட்டன்கள் -->
        <div class="btn-container">
            <button id="btnA" class="btn off">A: 0</button>
            <button id="btnB" class="btn off">B: 0</button>
        </div>
    </div>

    <script>
        let inA = 0, inB = 0;
        const btnA = document.getElementById('btnA');
        const btnB = document.getElementById('btnB');
        const statusText = document.getElementById('statusText');

        function updateLogic() {
            let out = (inA === 1 && inB === 1) ? 1 : 0;

            if (out === 1) {
                statusText.innerText = 'OUTPUT: 1 (ON)';
                statusText.style.color = '#00ff00';
            } else {
                statusText.innerText = 'OUTPUT: 0 (OFF)';
                statusText.style.color = '#ff4444';
            }
        }

        btnA.onclick = () => {
            inA = inA === 0 ? 1 : 0;
            btnA.innerText = `A: ${inA}`;
            btnA.className = inA ? 'btn on' : 'btn off';
            updateLogic();
        };

        btnB.onclick = () => {
            inB = inB === 0 ? 1 : 0;
            btnB.innerText = `B: ${inB}`;
            btnB.className = inB ? 'btn on' : 'btn off';
            updateLogic();
        };
    </script>
</body>
</html>
