<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IIST AR - Tracked Table Fix</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #ui { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; display: none; width: 85%; max-width: 320px;
        }
        .btn-container { display: flex; gap: 10px; }
        .btn { 
            flex: 1; padding: 18px 10px; cursor: pointer; border: none; 
            border-radius: 15px; font-weight: bold; font-size: 16px; 
            transition: 0.3s; text-transform: uppercase;
        }
        .off { background: #333; color: #888; border-bottom: 4px solid #111; }
        .on { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; border-bottom: 4px solid #008800; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="btn-container">
            <button id="btnA" class="btn off">A: 0</button>
            <button id="btnB" class="btn off">B: 0</button>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;" 
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- முக்கியமானது: இங்கே targetIndex நீங்கள் உருவாக்கிய .mind கோப்பில் உள்ள எண்ணுக்குச் சரியாக இருக்க வேண்டும் -->
        <a-entity mindar-image-target="targetIndex: 0" id="andTarget">
            
            <!-- அட்டவணைப் பலகை - இதைப் படத்தின் மையத்தில் (0 0 0) வைத்துள்ளேன் -->
            <a-entity id="panelContainer" position="0 0 0" scale="1 1 1">
                
                <!-- கறுப்பு நிறப் பின்னணி -->
                <a-plane width="1" height="1.2" color="#000" opacity="0.9" side="double"></a-plane>
                
                <!-- Border Line -->
                <a-rect width="1" height="1.2" fill="none" stroke="#00d2ff" stroke-width="0.02"></a-rect>

                <!-- தலைப்பு -->
                <a-text value="AND GATE TABLE" position="0 0.5 0.01" align="center" width="2" color="#00d2ff" font="exo2bold"></a-text>
                
                <!-- அட்டவணைத் தரவுகள் -->
                <a-text value="A    B  |  OUT" position="0 0.35 0.01" align="center" width="2.4" color="#aaa"></a-text>
                
                <a-text value="0    0  |   0" position="0 0.2 0.01" align="center" width="2.2" color="white"></a-text>
                <a-text value="0    1  |   0" position="0 0.05 0.01" align="center" width="2.2" color="white"></a-text>
                <a-text value="1    0  |   0" position="0 -0.1 0.01" align="center" width="2.2" color="white"></a-text>
                
                <!-- மாறும் கடைசி வரி - ஹைலைட் உடன் -->
                <a-plane id="highlight" position="0 -0.28 0.005" width="0.85" height="0.15" color="#222">
                    <a-text id="rowActive" value="1    1  |   0" position="0 0 0.01" align="center" width="2.5" color="#ff4444" font="exo2bold"></a-text>
                </a-plane>

                <a-text value="IIST JAFFNA" position="0 -0.5 0.01" align="center" width="1.2" color="#444"></a-text>
            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        let inA = 0, inB = 0;
        const ui = document.querySelector('#ui');
        const andTarget = document.querySelector('#andTarget');
        const btnA = document.getElementById('btnA'), btnB = document.getElementById('btnB');
        const rowActive = document.getElementById('rowActive');
        const highlight = document.getElementById('highlight');

        // Target கண்டறியப்படும் போது மட்டும் UI தெரிய வேண்டும்
        andTarget.addEventListener("targetFound", () => { 
            console.log("Target Found!");
            ui.style.display = "block"; 
        });

        andTarget.addEventListener("targetLost", () => { 
            console.log("Target Lost!");
            ui.style.display = "none"; 
        });

        function updateLogic() {
            let out = (inA === 1 && inB === 1) ? 1 : 0;
            
            if (out === 1) {
                rowActive.setAttribute('value', '1    1  |   1');
                rowActive.setAttribute('color', '#00ff00');
                highlight.setAttribute('color', '#003300');
            } else {
                rowActive.setAttribute('value', '1    1  |   0');
                rowActive.setAttribute('color', '#ff4444');
                highlight.setAttribute('color', '#330000');
            }
        }

        btnA.onclick = () => {
            inA = inA === 0 ? 1 : 0;
            btnA.innerText = `A: ${inA}`;
            btnA.className = inA ? 'btn on' : 'btn off';
            updateLogic();
        };

        btnB.onclick = () => {
            inB = inB === 0 ? 1 : 0;
            btnB.innerText = `B: ${inB}`;
            btnB.className = inB ? 'btn on' : 'btn off';
            updateLogic();
        };
    </script>
</body>
</html>
